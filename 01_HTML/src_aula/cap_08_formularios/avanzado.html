<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo formulario básico</title>
</head>

<body>

    <h1>Cap 08: Formularios</h1>

    <form action="procesa.php" method="get" enctype="multipart/form-data"> 
    <!-- method get/post -->

        <p>
            <label for="so">Sistema operativo</label> <br />
            <select name="so" id="so" size="12">
                <optgroup label="Sistemas Operativos">
                    <option value="Windows" selected="selected">Windows</option>
                    <option value="Mac">Mac</option>
                    <option value="Linux">Linux</option>
                    <option value="Other">Otro</option>
                  </optgroup>
                  <optgroup label="Navegadores">
                    <option value="Internet Explorer" selected="selected">Internet Explorer</option>
                    <option value="Firefox">Firefox</option>
                    <option value="Safari">Safari</option>
                    <option value="Opera">Opera</option>
                    <option value="Other">Otro</option>
                  </optgroup>
            </select>
        </p>

        <p>
            <label for="reclama">Texto Reclamación</label> <br>
            <textarea name="reclama" id="reclama" cols="80" rows="10" maxlength="20'"></textarea>
        </p>

        <fieldset>
            <legend>Datos usuario</legend>
            <p>
                <label for="usuario">Usuario/login</label> <br>
                <input type="text" name="login" id="usuario" required minlength="2" maxlength="4" size="42">
            </p>
            <p> <!-- Otra forma de enlazar label con input -->
                <label>Clave <br>
                    <input type="password" name="clave">
                </label>
            </p>
        </fieldset>

        <p>
            <label>Fichero con la factura
                <input type="file" name="factura"> <!-- multiple: atributo si varios ficheros -->
            </label>
        </p>

        <p>
            <input type="checkbox" name="legales" id="legales" value="si">
            <label for="legales">Acepto condiciones legales</label>
        </p>

        <p> Aficiones <br>
            <label> <input type="checkbox" name="aficiones" value="S"> Series </label>
            <label> <input type="checkbox" name="aficiones" value="V"> Videojuegos </label>
            <label> <input type="checkbox" name="aficiones" value="M"> Música </label>
        </p>

        <p> Elegir módulo preferido <br>
            <label> <input type="radio" name="modulo" value="LMSGI"> Lenguaje de Marcas</label> <br>
            <label> <input type="radio" name="modulo" value="PAR"> Redes</label> <br>
            <label> <input type="radio" name="modulo" value="BD"> Bases de DAtos</label>

        </p>

        <p>v  <!-- para asociar código javascript  -->
            <input type="button" name="guardar" value="Guardar Cambios" />
        </p>


        <p>  <!-- hace funciones de submit -->
            <input type="image" src="figuras/Hopstarter-Button-Button-Next.72.png" alt="icon de flecha">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpiar">

    </form>



</body>

</html>
