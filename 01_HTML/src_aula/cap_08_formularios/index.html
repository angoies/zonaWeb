<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario básico</title>
</head>

<body>

  <h1>Formulario básico</h1>
  <ul>
    <li>Pruebe a modificar action a los valores <code>post</code> o <code>get</code> y observe la URL</li>
    <li>Añada en <code>action</code> URLs de servidores propuestos para procesar la petición.</li>
    <li>Puede probar con un formulario más completo: <a href="formulario-html5.html">Formulario con nuevos campos HTML</a></p>
  </u>
  
  
  <form action="" method="get">  <!-- metodos get o post -->
  <!-- puede usar en action las URLs propuestas en clase -->
    <p>
      <label>Usuario <br>
        <input type="text" name="usuario">
      </label>
    </p>
    <p>
      <label>Clave <br>
        <input type="password" name="clave">
      </label>
    </p>    
    <p>
      <input type="submit" value="Enviar">
      <input type="reset" value="Borrar">
    </p>
  </form>

</body>

</html>
